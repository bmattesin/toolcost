[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bmattesin-toolcost"
version = "0.1.0"
description = "按段落统计智能体工具选择的错误代价相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "bmattesin" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://bmattesin.github.io"
Repository = "https://github.com/bmattesin/toolcost"
Issues = "https://github.com/bmattesin/toolcost/issues"

[project.scripts]
toolcost = "toolcost:main"

[tool.setuptools]
py-modules = ["toolcost"]
